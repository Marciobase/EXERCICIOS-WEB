<!-- Formulário -->
<div class="card">
  <div class="card-header">
    <h5 class="mb-0">
      Exermplo de formulários
    </h5>
  </div>
  <div class="card-body">
    <form action="" class="container-fluid" method="POST"> 

      <div class="form-row">
        <div class="col-12">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" class="form-control" id="nome" style="max-width:500en;" placeholder="Infome o nome">
          </div>
        </div>
      </div>

      <div class="form-row">

        <div class="col-12 col-md-4">
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text">@</span>
              </div>
              <input type="email" class="form-control" id="email" placeholder="Informe o e-mail"
                style="max-width:400px;">
            </div>
            <small class="form-text text-danger">O seu cadastro deverá ser confirmado pelo e-mail</small>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="form-group">
            <label for="passw">Senha</label>
            <input type="password" class="form-control" id="passw" placeholder="Digite a senha escolhida"
              style="max-width:200px;">
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="form-group">
            <label for="linguagem">Linguagem</label>
            <select name="" id="linguagem" class="form-control" style="max-width:150px;">
              <option value="">Selecione....</option>
              <option>Inglês</option>
              <option>Protuguêns</option>
            </select>
          </div>
        </div>

      </div>



      <div class="form-row">
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="1" id="funcAtivo" checked>
            <label class="form-check-label" for="funcAtivo">
              Ativo
            </label>
          </div>
        </div>
      </div>



      <div class="form-row">
        <div class="col-12">
          <div class="form-group">
            <label for="myDateInput">Selecione a Data:</label>
            <input type="date" class="form-control" id="myDateInput" name="myDate" style="max-width:200px;">
          </div>
        </div>
      </div>


      <hr>
      <div class="form-row mb-0">
        <div class="col-12 d-flex justify-content-end">
          <button class="btn btn-primary mr-1" type="submit">Salvar</button>
          <button class="btn btn-scondary mr-1" type="reset">Cancelar</button>
          <button class="btn btn-danger" type="reset">Excluir</button>
        </div>
      </div>
    </form>
  </div>
</div>
